<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>hook mock</title></head>
<body>
<h1>Hook simulation</h1>
<script src="../../src/content/hook-main.js"></script>
<script>
  window.__got = { audios: [], lyrics: null };
  window.addEventListener('message', (e) => {
    if (!e.data || e.data.src !== 'VKMF') return;
    if (e.data.t === 'AUDIOS') window.__got.audios.push(...e.data.p);
    if (e.data.t === 'LYRICS') window.__got.lyrics = e.data.p;
  });

  const json = JSON.stringify({
    response: {
      items: [
        {
          id: 101, owner_id: 55,
          artist: 'Кино', title: 'Группа крови', duration: 289,
          url: 'https://cs1-1.vk-cdn.net/mp3/x.mp3',
          album: {
            title: 'Альбом',
            thumbs: [
              { width: 300, height: 300, src: 'https://sun.cdn/small_300x300.jpg' },
              { width: 600, height: 600, src: 'https://sun.cdn/big_600x600.jpg' }
            ]
          }
        },
        {
          id: 102, owner_id: 55,
          main_artists: [{ name: 'Мастер' }],
          title: 'Трек два', duration: 180,
          hls: 'https://userapi.com/hls/index.m3u8'
        },
        {
          // Real web-player shape (captured from vk.ru/audios): `url` empty,
          // audio is the HLS on vkuseraudio, artwork is a flat photo_* map on
          // vkuserphoto. The old `vkuser` host pattern matched BOTH hosts, so
          // the cover JPEGs ended up in `urls` and `covers` stayed empty.
          id: 103, owner_id: 55,
          artist: 'Blond:ish', title: 'Wunderkammer', duration: 417,
          url: '',
          hls: 'https://cs9-3v4.vkuseraudio.ru/s/v1/ac/ABCDEF/index.m3u8?siren=1',
          thumb: {
            width: 750, height: 750, id: '457239151',
            photo_34: 'https://sun1-24.vkuserphoto.ru/impg/a14tnq/Pr.jpg?size=34x34&type=audio',
            photo_300: 'https://sun1-24.vkuserphoto.ru/impg/a14tnq/Pr.jpg?size=300x300&type=audio',
            photo_1200: 'https://sun1-24.vkuserphoto.ru/impg/a14tnq/Pr.jpg?size=1200x1200&type=audio'
          }
        }
      ]
    },
    extra: { lyrics: 'текст песни длиннее тридцати символов для валидации', id: 101 }
  });

  fetch('data:application/json;charset=utf-8,' + encodeURIComponent(json)).then(r => r.text());

  const blob = new Blob([json], { type: 'application/json' });
  const xhr = new XMLHttpRequest();
  xhr.open('GET', URL.createObjectURL(blob));
  xhr.send();
</script>
</body>
</html>
